:root{
  --bg:#ffffff; --bg2:#f1f8f4; --ink:#12263a; --ink2:#51657a; --line:#d9e5df;
  --green:#0f7b4f; --green-h:#0a6340; --on-green:#ffffff; --green-t:#e0f3ea;
  --blue:#1b6ca8; --blue-t:#e1eef9; --amber:#a86a0a; --amber-t:#fbf0d9;
  --red:#b3261e; --red-t:#fbe8e5; --focus:#1b6ca8;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Bricolage Grotesque","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a22; --bg2:#122630; --ink:#e8f1ee; --ink2:#a3b6b2; --line:#27414b;
    --green:#3fc08a; --green-h:#66d4a5; --on-green:#06231a; --green-t:#133a2c;
    --blue:#62b0ec; --blue-t:#12324a; --amber:#e6b44f; --amber-t:#3a2d0f;
    --red:#f08a82; --red-t:#3e1b19; --focus:#62b0ec; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a22; --bg2:#122630; --ink:#e8f1ee; --ink2:#a3b6b2; --line:#27414b;
  --green:#3fc08a; --green-h:#66d4a5; --on-green:#06231a; --green-t:#133a2c;
  --blue:#62b0ec; --blue-t:#12324a; --amber:#e6b44f; --amber-t:#3a2d0f;
  --red:#f08a82; --red-t:#3e1b19; --focus:#62b0ec; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;letter-spacing:-.015em;margin:0 0 .5em;font-weight:800}
h1{font-size:clamp(1.9rem,4.6vw,3.2rem);letter-spacing:-.025em}
h2{font-size:clamp(1.4rem,2.6vw,1.9rem)}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em;max-width:68ch}
a{color:var(--blue)}
img,svg{max-width:100%}
.muted{color:var(--ink2)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--green);color:var(--on-green);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-disp);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo svg{width:32px;height:32px}
.nav{display:flex;gap:4px;margin-left:12px;flex:1}
.nav a{color:var(--ink2);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--green);background:var(--green-t)}
.acts{display:flex;gap:8px;align-items:center}
.burger{display:none}
@media (max-width:860px){
  .burger{display:inline-flex;margin-left:auto}
  .nav,.acts{display:none}
  .top.open .wrap{flex-wrap:wrap;padding-bottom:12px}
  .top.open .nav{display:flex;flex-direction:column;width:100%;margin:0}
  .top.open .acts{display:flex;width:100%}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--green);background:var(--green);color:var(--on-green);font:600 .95rem var(--f-body);padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{background:var(--green-h);border-color:var(--green-h)}
.btn.sec{background:transparent;color:var(--green)}
.btn.sec:hover{background:var(--green-t)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-t)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn.lg{padding:13px 24px;font-size:1.02rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fld label{font-weight:600;font-size:.92rem}
.fld small{color:var(--ink2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--ink2)}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.err{color:var(--red);margin:0 0 10px;font-weight:500}
.ok{color:var(--green);font-weight:500}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
.t-green{background:var(--green-t);color:var(--green);border-color:transparent}
.t-blue{background:var(--blue-t);color:var(--blue);border-color:transparent}
.t-amber{background:var(--amber-t);color:var(--amber);border-color:transparent}
.t-red{background:var(--red-t);color:var(--red);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* sections */
section.sec{padding:56px 0}
section.alt{background:var(--bg2)}
.shead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.shead h2{margin:0}
.pagehead{padding:36px 0 8px}
.pagehead p{color:var(--ink2)}

/* hero */
.hero{padding:48px 0 56px;border-bottom:1px solid var(--line)}
.hero-g{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero p.lead{font-size:1.15rem;color:var(--ink2)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
@media (max-width:900px){.hero-g{grid-template-columns:1fr;gap:28px}}
.bmi-panel{border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--bg)}
.bmi-panel h2{font-size:1.25rem}
.bmi-v{display:flex;align-items:center;gap:12px;margin:8px 0 0}
.bmi-v strong{font:800 2.6rem var(--f-disp);line-height:1}
.scale{display:flex;height:14px;border-radius:99px;overflow:hidden;position:relative;margin-top:20px}
.scale i{display:block;height:100%}
.s-blue{background:#5aa9e6}.s-green{background:#2fa56f}.s-amber{background:#e0a82e}.s-red{background:#d9622b}

async function hashPw(salt,pw){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;for(const c of salt+':'+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}
}

/* ---------- data accessors ---------- */
const me=()=>{const u=DB.users.find(x=>x.id===sessionId&&x.active);return u||null};
const prof=id=>DB.profiles[id]||{};
const exOf=id=>DB.exercises.find(e=>e.id===id);
const foodOf=id=>DB.foods.find(f=>f.id===id);
const byDateDesc=(a,b)=>(b.date||'').localeCompare(a.date||'');
const myLogs=u=>DB.healthLogs.filter(l=>l.userId===u).sort((a,b)=>a.date.localeCompare(b.date));
const latestW=u=>{const l=myLogs(u).filter(x=>x.weight>0);return l.length?l[l.length-1]:null};
const planStatus=p=>{const n=p.items.length,d=p.items.filter(i=>i.done).length;if(!n||!d)return'Chưa tập';return d===n?'Hoàn thành':'Đang tập'};
const foodVals=(f,q)=>{const r=q/f.refQty;return{cal:f.cal*r,protein:f.protein*r,carbs:f.carbs*r,fat:f.fat*r}};
const sumItems=items=>items.reduce((s,it)=>{const f=foodOf(it.foodId);if(!f)return s;const v=foodVals(f,it.qty);return{cal:s.cal+v.cal,protein:s.protein+v.protein,carbs:s.carbs+v.carbs,fat:s.fat+v.fat}},{cal:0,protein:0,carbs:0,fat:0});

/* ---------- BMI ---------- */
const bmiOf=(h,w)=>w/((h/100)**2);
const bmiCat=b=>b<18.5?['Thiếu cân','blue']:b<25?['Bình thường','green']:b<30?['Thừa cân','amber']:['Béo phì','red'];
const bmiErr=(h,w)=>{
  if(!(h>0)||!(w>0))return'Nhập chiều cao và cân nặng lớn hơn 0.';
  if(h<100||h>250)return'Chiều cao cần nằm trong khoảng 100–250 cm.';
  if(w<20||w>300)return'Cân nặng cần nằm trong khoảng 20–300 kg.';
  return null;
};
function bmiScale(p){
  return `<div class="scale" aria-hidden="true"><i class="s-blue" style="width:14%"></i><i class="s-green" style="width:26%"></i><i class="s-amber" style="width:20%"></i><i class="s-red" style="width:40%"></i><b class="mk" id="${p}mk" style="left:0;display:none"></b></div>
  <div class="scale-l" aria-hidden="true"><span style="left:0">15</span><span style="left:14%">18,5</span><span style="left:40%">25</span><span style="left:60%">30</span><span style="left:100%">40</span></div>`;
}
function bmiBox(p,h,w){
  return `<div class="row">
    <div class="fld"><label for="${p}h">Chiều cao (cm)</label><input id="${p}h" type="number" inputmode="decimal" step="any" min="0" value="${h||''}" placeholder="Ví dụ: 165"></div>
    <div class="fld"><label for="${p}w">Cân nặng (kg)</label><input id="${p}w" type="number" inputmode="decimal" step="any" min="0" value="${w||''}" placeholder="Ví dụ: 58"></div></div>
    <div id="${p}r" aria-live="polite"></div>${bmiScale(p)}`;
}
function updBmi(p){
  const hi=$('#'+p+'h'),wi=$('#'+p+'w'),r=$('#'+p+'r'),mk=$('#'+p+'mk');
  if(!hi.value&&!wi.value){r.innerHTML='<p class="muted" style="margin:0">Nhập chiều cao và cân nặng để xem kết quả.</p>';mk.style.display='none';return null}
  const h=parseFloat(hi.value),w=parseFloat(wi.value),e=bmiErr(h,w);
  if(e){r.innerHTML=`<p class="err" style="margin:0">${e}</p>`;mk.style.display='none';return null}
  const b=bmiOf(h,w),c=bmiCat(b);
  mk.style.display='block';mk.style.left=((Math.min(40,Math.max(15,b))-15)/25*100)+'%';
  r.innerHTML=`<p class="bmi-v"><strong>${num(b,1)}</strong><span class="tag t-${c[1]}">${c[0]}</span></p>`;
  return{h,w,b};
}
const BMI_NOTE='BMI chỉ là chỉ số tham khảo, không đủ để đánh giá toàn bộ sức khỏe. Công cụ dành cho người từ 18 tuổi trở lên. Với người châu Á, nhiều khuyến nghị dùng ngưỡng thấp hơn (thừa cân từ khoảng 23).';

function art(cat){const ph=PHOTO[cat]||PHOTO['Cardio'];return `<div class="art photo-art" style="background-image:var(--photo-${ph[0]});background-size:cover;background-position:${ph[1]}" role="img" aria-label="Ảnh minh họa: ${esc(cat)}"></div>`;}
const artFor=c=>art(ARTCAT[c]||'Cardio');
function lineChart(pts,o={}){
  if(pts.length<2)return'<p class="muted">Cần ít nhất 2 lần ghi cân nặng để vẽ biểu đồ.</p>';
  const W=640,H=240,L=46,R=16,T=16,B=30,ys=pts.map(p=>p.y);if(o.target)ys.push(o.target);
  let mn=Math.min(...ys),mx=Math.max(...ys);const pd=(mx-mn)*.18||1;mn-=pd;mx+=pd;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${num(v,1)}</text>`}
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="var(--green)"><title>${esc(p.x)}: ${num(p.y,1)}</title></circle>`).join('');
  const tg=o.target?`<line x1="${L}" x2="${W-R}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--blue)" stroke-dasharray="6 5" stroke-width="2"/><text x="${W-R}" y="${Y(o.target)-6}" text-anchor="end" style="fill:var(--blue)">Mục tiêu ${num(o.target,1)}</text>`:'';
  const mid=Math.floor((pts.length-1)/2);
  const xl=[0,mid,pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(pts[i].x)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cân nặng theo thời gian, từ ${num(pts[0].y,1)} đến ${num(pts[pts.length-1].y,1)} ${o.unit||''}">${g}${tg}<path d="${d}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
function barChart(data,label){
  const W=640,H=220,L=36,R=10,T=14,B=30,mx=Math.max(1,...data.map(d=>d.v)),bw=(W-L-R)/data.length;
  let g='';for(let k=0;k<=2;k++){const v=Math.round(mx*k/2),y=T+(H-T-B)*(1-k/2);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`}
  const bars=data.map((d,i)=>{const h=(H-T-B)*d.v/mx,x=L+i*bw+bw*.2;return `<rect x="${x}" y="${H-B-h}" width="${bw*.6}" height="${h}" rx="4" fill="var(--blue)"><title>${esc(d.l)}: ${d.v}</title></rect><text x="${x+bw*.3}" y="${H-10}" text-anchor="middle">${esc(d.l)}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${bars}</svg>`;
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function fld(f){
  const v=f.value==null?'':f.value,id='f_'+f.name,req=f.required?' required':'';let c;
  if(f.type==='select')c=`<select id="${id}" name="${f.name}"${req}>${opt(f.options,v)}</select>`;
  else if(f.type==='textarea')c=`<textarea id="${id}" name="${f.name}" rows="${f.rows||4}"${req}>${esc(v)}</textarea>`;
  else c=`<input id="${id}" name="${f.name}" type="${f.type||'text'}" value="${esc(v)}"${req}${f.type==='number'?' step="any"':''}${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}${f.ph?` placeholder="${esc(f.ph)}"`:''}${f.ac?` autocomplete="${f.ac}"`:''}>`;
  return `<div class="fld"><label for="${id}">${esc(f.label)}</label>${c}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
}

function modal(title,body,onSubmit,o={}){
  const d=$('#dlg');
  d.innerHTML=`<form class="mform"><h2 id="dlgt">${esc(title)}</h2>${body}<p class="err" id="merr" role="alert"></p><div class="mact"><button type="button" class="btn ghost" onclick="App.closeM()">Hủy</button><button class="btn${o.danger?' danger':''}">${esc(o.submit||'Lưu')}</button></div></form>`;
  d.querySelector('form').onsubmit=async e=>{
    e.preventDefault();
    const r=await onSubmit(Object.fromEntries(new FormData(e.target)));
    if(r===true){d.close();rerender()}else $('#merr').textContent=r||'';
  };
  if(!d.open)d.showModal();
}

const NU={q:''};
function nuDraw(){
  const q=NU.q.trim().toLowerCase(),l=DB.foods.filter(f=>!q||f.name.toLowerCase().includes(q));
  $('#nures').innerHTML=l.length?`<div class="scroll"><table><thead><tr><th>Thực phẩm</th><th>Khẩu phần tham chiếu</th><th class="n">Năng lượng (kcal)</th><th class="n">Protein (g)</th><th class="n">Carbohydrate (g)</th><th class="n">Chất béo (g)</th></tr></thead><tbody>${l.map(f=>`<tr><td>${esc(f.name)}</td><td>${num(f.refQty,0)} ${esc(f.unit)}</td><td class="n">${num(f.cal,0)}</td><td class="n">${num(f.protein)}</td><td class="n">${num(f.carbs)}</td><td class="n">${num(f.fat)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không tìm thấy thực phẩm nào khớp với từ khóa.</div>';
}
function calcFood(){
  const f=foodOf($('#cf').value),q=parseFloat($('#cq').value),r=$('#cr');
  if(!f)return;$('#cu').textContent=f.unit;
  if(!(q>0)){r.innerHTML='<p class="muted">Nhập lượng lớn hơn 0 để tính.</p>';return}
  const v=foodVals(f,q);
  r.innerHTML=`<div class="macro"><div><b>${num(v.cal,0)}</b><span>kcal</span></div><div><b>${num(v.protein)}</b><span>Protein (g)</span></div><div><b>${num(v.carbs)}</b><span>Carb (g)</span></div><div><b>${num(v.fat)}</b><span>Chất béo (g)</span></div></div>`;
}
function calTarget(u){
  if(!u)return null;const p=prof(u.id),lw=latestW(u.id),a=age(p.birthDate);
  if(!p.heightCm||!lw||a==null||a<18||!p.gender)return null;
  const bmr=10*lw.weight+6.25*p.heightCm-5*a+(p.gender==='Nam'?5:p.gender==='Nữ'?-161:-78);
  const f={'Ít vận động':1.2,'Vận động nhẹ':1.375,'Vận động vừa':1.55,'Vận động nhiều':1.725}[p.activity]||1.2;
  const tdee=bmr*f,adj=p.goal==='Giảm cân'?-400:p.goal==='Tăng cơ'?250:0;
  return{tdee:Math.round(tdee),target:Math.round(Math.max(tdee+adj,1200)),goal:p.goal||''};
}
function calBar(kcal,g){
  if(!g)return'';const pct=Math.round(kcal/g.target*100),w=Math.min(pct,100),left=g.target-kcal;
  return `<div class="bar" role="progressbar" aria-valuenow="${w}" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến độ calo trong ngày"><i class="${pct>100?'over':''}" style="width:${w}%"></i></div>
  <p class="fine">Mục tiêu tham khảo khoảng <b>${num(g.target,0)} kcal/ngày</b> (nhu cầu ước tính ${num(g.tdee,0)} kcal${g.goal?`, điều chỉnh theo mục tiêu “${esc(g.goal)}”`:''}). ${left>=0?`Còn khoảng <b>${num(left,0)} kcal</b>.`:`Đã vượt khoảng <b>${num(-left,0)} kcal</b>.`} Đây chỉ là ước tính (công thức Mifflin-St Jeor), không thay thế tư vấn của chuyên gia dinh dưỡng.</p>`;
}
function macroBox(t){return `<div class="macro"><div><b>${num(t.cal,0)}</b><span>kcal</span></div><div><b>${num(t.protein)}</b><span>Protein (g)</span></div><div><b>${num(t.carbs)}</b><span>Carbohydrate (g)</span></div><div><b>${num(t.fat)}</b><span>Chất béo (g)</span></div></div>`}
function calCard(tot,day){
  const u=me(),g=calTarget(u);
  const rows=MEALS.map(t=>{const m=day.find(x=>x.type===t),sm=sumItems(m?m.items:[]),w=tot.cal>0?Math.round(sm.cal/tot.cal*100):0;
    return `<div class="calrow"><span>${t}</span><div class="bar" aria-hidden="true"><i style="width:${w}%"></i></div><b>${num(sm.cal,0)} kcal</b></div>`}).join('');
  return `<div class="pn calcard"><h2>Calo ngày ${vd(MD)}</h2>
  <div class="calnum"><b>${num(tot.cal,0)}</b><span class="muted">kcal đã ăn</span></div>
  ${g?calBar(tot.cal,g):`<p class="fine">Cập nhật chiều cao, ngày sinh, giới tính, mức vận động và ghi cân nặng để xem mục tiêu calo tham khảo. <a href="#/tai-khoan/ho-so">Mở hồ sơ</a></p>`}
  ${macroBox(tot)}
  <h3 style="margin:18px 0 6px;font-size:1rem">Calo theo từng bữa</h3><div class="calsplit">${rows}</div>
  <p class="fine">Tổng được cộng từ lượng thực phẩm bạn nhập, theo tỷ lệ với khẩu phần tham chiếu.</p></div>`;
}
const DAY=[];
function dayDraw(){

}

  return shell('admin','/quan-tri/gop-y','Góp ý',l.length?l.map(f=>{const u=DB.users.find(x=>x.id===f.userId);return `<div class="pn"><div class="plan-h"><div><h3>${esc(f.subject)}</h3><span class="muted">${esc(u?u.email:'Tài khoản đã xóa')} · ${vd(f.createdAt)}</span></div><div class="ta"><span class="tag ${f.status==='Đã phản hồi'?'t-green':f.status==='Đang xử lý'?'t-blue':''}">${f.status}</span><button class="btn sec sm" onclick="App.replyFb('${f.id}')">Cập nhật / phản hồi</button></div></div><p>${esc(f.content)}</p>${f.reply?`<div class="note"><strong>Đã phản hồi:</strong> ${esc(f.reply)}</div>`:''}</div>`}).join(''):'<div class="empty">Chưa có góp ý nào.</div>');
}

/* ---------- router ---------- */
const R=[
 ['/',viewHome],['/bai-tap',viewExercises],['/bai-tap/:id',viewExercise],['/dinh-duong',viewNutrition],['/kien-thuc',viewArticles],['/kien-thuc/:id',viewArticle],['/lien-he',viewContact],
 ['/dang-nhap',viewLogin,'guest'],['/dang-ky',viewRegister,'guest'],
 ['/tai-khoan',uOverview,'user'],['/tai-khoan/ho-so',uProfile,'user'],['/tai-khoan/bmi',uBmi,'user'],['/tai-khoan/lich-tap',uPlans,'user'],['/tai-khoan/an-uong',uMeals,'user'],['/tai-khoan/theo-doi',uHealth,'user'],['/tai-khoan/gop-y',uFeedback,'user'],
 ['/quan-tri',aOverview,'admin'],['/quan-tri/tai-khoan',aUsers,'admin'],['/quan-tri/bai-tap',aExercises,'admin'],['/quan-tri/thuc-pham',aFoods,'admin'],['/quan-tri/bai-viet',aArticles,'admin'],['/quan-tri/gop-y',aFeedback,'admin']
];
let keepScroll=false;
function route(){
  const path=(location.hash.slice(1)||'/').split('?')[0].replace(/\/$/,'')||'/';
  let hit=null;
  for(const [p,v,acc] of R){const m=path.match(new RegExp('^'+p.replace(/:\w+/g,'([\\w-]+)')+'$'));if(m){hit={v,acc,args:m.slice(1)};break}}
  const u=me();
  if(hit){
    if(hit.acc==='guest'&&u)return go(u.role==='admin'?'/quan-tri':'/tai-khoan');
    if(hit.acc==='user'){if(!u){afterLogin=path;return go('/dang-nhap')}if(u.role==='admin')return go('/quan-tri')}
    if(hit.acc==='admin'){if(!u){afterLogin=path;return go('/dang-nhap')}if(u.role!=='admin'){toast('Bạn không có quyền vào khu quản trị.');return go('/tai-khoan')}}
  }
  post=null;
  const y=window.scrollY;
  $('#main').innerHTML=hit?hit.v(...hit.args):view404();
  drawHeader(path);
  $('#top').classList.remove('open');
  enhanceView(path);
  if(post)post();
  const h=$('#main h1');document.title=(h?h.textContent+' – ':'')+'FitHealth';
  if(keepScroll){window.scrollTo(0,y)}else{window.scrollTo(0,0)}
  keepScroll=false;
}
function rerender(){keepScroll=true;route()}
window.addEventListener('hashchange',route);

/* ---------- actions ---------- */
const emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const pwOk=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);
const num0=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const App={
  menu(b){const t=$('#top');t.classList.toggle('open');b.setAttribute('aria-expanded',t.classList.contains('open'))},
  closeM(){$('#dlg').close()},
  async login(e){
    e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),er=$('#aerr');
    const u=DB.users.find(x=>x.email.toLowerCase()===d.email.trim().toLowerCase());
    if(!u||u.hash!==await hashPw(u.salt,d.password)){er.textContent='Email hoặc mật khẩu không đúng.';return false}
    if(!u.active){er.textContent='Tài khoản này đã bị khóa. Hãy liên hệ quản trị viên.';return false}
    sessionId=u.id;lsSet(SKEY,u.id);
    const n=afterLogin;afterLogin=null;
    go(n&&((u.role==='admin')===n.startsWith('/quan-tri'))?n:(u.role==='admin'?'/quan-tri':'/tai-khoan'));toast('Đăng nhập thành công.');return false;
  },
  async register(e){
    e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),er=$('#aerr'),em=d.email.trim().toLowerCase();
    if(!d.fullName.trim()){er.textContent='Hãy nhập họ tên.';return false}
    if(!emailRe.test(em)){er.textContent='Email chưa đúng định dạng.';return false}
    if(DB.users.some(x=>x.email.toLowerCase()===em)){er.textContent='Email này đã được đăng ký. Hãy đăng nhập hoặc dùng email khác.';return false}
    if(!pwOk(d.password)){er.textContent='Mật khẩu cần ít nhất 8 ký tự, gồm cả chữ và số.';return false}
    if(d.password!==d.password2){er.textContent='Hai mật khẩu chưa khớp.';return false}
    const salt=uid(),u={id:uid(),email:em,salt,hash:await hashPw(salt,d.password),role:'user',active:true,createdAt:todayISO()};
    DB.users.push(u);DB.profiles[u.id]={fullName:d.fullName.trim()};save();
    sessionId=u.id;lsSet(SKEY,u.id);go('/tai-khoan/ho-so');toast('Đã tạo tài khoản. Hãy hoàn thiện hồ sơ của bạn.');return false;
  },
  logout(){sessionId=null;lsDel(SKEY);go('/');toast('Đã đăng xuất.')},
  saveProfile(e){
    e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),er=$('#perr'),u=me(),h=num0(d.heightCm),tw=num0(d.targetWeight);
    if(!d.fullName.trim()){er.textContent='Hãy nhập họ tên.';return false}
    if(d.birthDate&&d.birthDate>todayISO()){er.textContent='Ngày sinh không thể ở tương lai.';return false}
    if(d.heightCm&&(h<100||h>250)){er.textContent='Chiều cao cần nằm trong khoảng 100–250 cm.';return false}
    if(d.targetWeight&&(tw<20||tw>300)){er.textContent='Cân nặng mục tiêu cần nằm trong khoảng 20–300 kg.';return false}
    DB.profiles[u.id]={...DB.profiles[u.id],fullName:d.fullName.trim(),birthDate:d.birthDate,gender:d.gender,heightCm:h||null,activity:d.activity,goal:d.goal,targetWeight:tw||null};
    save();er.textContent='';toast('Đã lưu hồ sơ.');return false;
  },
  async chPw(e){
    e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),er=$('#werr'),u=me();
    if(u.hash!==await hashPw(u.salt,d.old)){er.textContent='Mật khẩu hiện tại chưa đúng.';return false}
    if(!pwOk(d.new1)){er.textContent='Mật khẩu mới cần ít nhất 8 ký tự, gồm cả chữ và số.';return false}
    if(d.new1!==d.new2){er.textContent='Hai mật khẩu mới chưa khớp.';return false}
    u.salt=uid();u.hash=await hashPw(u.salt,d.new1);save();e.target.reset();er.textContent='';toast('Đã đổi mật khẩu.');return false;
  },
  /* BMI */
  saveBmi(){
    const r=updBmi('ub');if(!r){toast('Hãy nhập số liệu hợp lệ trước khi lưu.');return}
    DB.bmi.push({id:uid(),userId:me().id,date:todayISO(),heightCm:r.h,weight:r.w,bmi:r.b});save();rerender();toast('Đã lưu vào lịch sử BMI.');

  nuf(v){NU.q=v;nuDraw()},
  arf(k,v){AR[k]=v;arDraw()},
  calcFood,

    if(location.protocol==='file:'){window.open('https://www.youtube.com/watch?v='+id,'_blank','noopener');return}

  },

  dayAdd(){const f=foodOf($('#df').value),q=parseFloat($('#dq').value);if(!f)return;if(!(q>0)){toast('Nhập lượng ăn lớn hơn 0.');return}DAY.push({meal:$('#dm').value,foodId:f.id,qty:q});dayDraw()},

    DAY.length=0;save();toast('Đã lưu vào nhật ký ăn uống hôm nay.');MD=d;go('/tai-khoan/an-uong')},

  addToPlan(exId){
    const u=me(),ps=DB.plans.filter(p=>p.userId===u.id&&planStatus(p)!=='Hoàn thành').sort(byDateDesc);
    if(!ps.length){modal('Chưa có lịch tập','<p>Bạn cần tạo một lịch tập trước khi thêm bài tập.</p>',()=>{go('/tai-khoan/lich-tap');return true},{submit:'Tạo lịch tập'});return}
    modal('Thêm vào lịch tập',flds([{name:'planId',label:'Lịch tập',type:'select',options:ps.map(p=>[p.id,`${p.name} (${vd(p.date)})`])},{name:'sets',label:'Số hiệp',type:'number',value:3,min:1},{name:'reps',label:'Số lần mỗi hiệp',type:'number',value:12,min:0},{name:'duration',label:'Thời gian (phút)',type:'number',value:0,min:0}]),d=>App._pushItem(d.planId,exId,d));
  },
  _pushItem(planId,exId,d){
    const p=DB.plans.find(x=>x.id===planId&&x.userId===me().id);if(!p)return'Không tìm thấy lịch tập.';
    const s=num0(d.sets),r=num0(d.reps),m=num0(d.duration);
    if(s<1)return'Số hiệp cần lớn hơn 0.';if(r<=0&&m<=0)return'Hãy nhập số lần hoặc thời gian lớn hơn 0.';
    p.items.push({id:uid(),exId,sets:s,reps:r,duration:m,done:false});save();toast('Đã thêm vào lịch tập.');return true;

  /* plans */
  newPlan(){modal('Tạo lịch tập',flds([{name:'name',label:'Tên lịch',required:true,ph:'Ví dụ: Tập chân'},{name:'date',label:'Ngày bắt đầu',type:'date',value:todayISO()},{name:'span',label:'Kiểu lịch',type:'select',options:[['day','Theo ngày'],['week','Theo tuần (7 ngày)']]}]),d=>{

  addItem(planId){
    const l=DB.exercises.filter(e=>e.active);
    modal('Thêm bài tập vào lịch',flds([{name:'exId',label:'Bài tập',type:'select',options:l.map(e=>[e.id,`${e.name} (${e.cat})`])},{name:'sets',label:'Số hiệp',type:'number',value:3,min:1},{name:'reps',label:'Số lần mỗi hiệp',type:'number',value:12,min:0},{name:'duration',label:'Thời gian (phút)',type:'number',value:0,min:0}]),d=>App._pushItem(planId,d.exId,d),{submit:'Thêm'});

  doneItem(pid,iid){
    const p=DB.plans.find(x=>x.id===pid&&x.userId===me().id),i=p&&p.items.find(x=>x.id===iid);if(!i)return;

  },
  undoItem(pid,iid){const p=DB.plans.find(x=>x.id===pid&&x.userId===me().id),i=p&&p.items.find(x=>x.id===iid);if(i){i.done=false;delete i.actual;delete i.completedOn;save();rerender()}},

  delFood(mid,ix){const m=DB.meals.find(x=>x.id===mid&&x.userId===me().id);if(m){m.items.splice(ix,1);if(!m.items.length)DB.meals=DB.meals.filter(x=>x.id!==mid);save();rerender()}},
  /* health */
  saveHealth(e){
    e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),er=$('#herr'),u=me(),w=num0(d.weight),wa=num0(d.water),s=num0(d.sleep);
    if(!d.date||d.date>todayISO()){er.textContent='Hãy chọn ngày không ở tương lai.';return false}
    if(!w&&!wa&&!s){er.textContent='Hãy nhập ít nhất một giá trị: cân nặng, nước uống hoặc giấc ngủ.';return false}
    if(d.weight&&(w<20||w>300)){er.textContent='Cân nặng cần nằm trong khoảng 20–300 kg.';return false}
    if(wa<0||wa>10000){er.textContent='Lượng nước cần từ 0 đến 10.000 ml.';return false}
    if(s<0||s>24){er.textContent='Số giờ ngủ cần từ 0 đến 24.';return false}
    const x=DB.healthLogs.find(l=>l.userId===u.id&&l.date===d.date),v={weight:w||0,water:wa,sleep:s,notes:d.notes.trim()};
    if(x)Object.assign(x,v);else DB.healthLogs.push({id:uid(),userId:u.id,date:d.date,...v});
    save();rerender();toast(x?'Đã cập nhật ghi nhận của ngày này.':'Đã lưu ghi nhận.');return false;

  addWater(){
    const u=me(),t=todayISO();let x=DB.healthLogs.find(l=>l.userId===u.id&&l.date===t);

App.finishWorkout=()=>{if(!workout)return;const p=DB.plans.find(p=>p.id===workout.pid&&p.userId===me().id),i=p&&p.items.find(i=>i.id===workout.iid);if(!i)return;const seconds=Math.floor((workout.elapsed+(workout.started?Date.now()-workout.started:0))/1000);const pid=workout.pid,iid=workout.iid;stopTimer();workout=null;modal('Xác nhận kết quả thực tế',flds([{name:'sets',label:'Số hiệp đã tập',type:'number',value:i.sets,min:1},{name:'reps',label:'Số lần mỗi hiệp',type:'number',value:i.reps,min:0},{name:'duration',label:'Phút tập thực tế (có thể chỉnh)',type:'number',value:Math.round(seconds/60*10)/10,min:0},{name:'notes',label:'Ghi chú',type:'textarea'}]),d=>{const sets=Number(d.sets),reps=Number(d.reps),duration=Number(d.duration);if(!Number.isFinite(sets)||sets<1||!Number.isFinite(reps)||reps<0||!Number.isFinite(duration)||duration<0)return'Kiểm tra số liệu thực tế.';if(!reps&&!duration)return'Nhập số lần hoặc thời gian thực tế.';i.done=true;i.completedOn=todayISO();i.actual={sets,reps,duration,notes:d.notes.trim()};save();toast('Đã lưu kết quả thực tế.');return true},{submit:'Xác nhận hoàn thành'})};
$('#dlg').addEventListener('close',()=>{stopTimer();workout=null});$('#dlg').addEventListener('cancel',()=>{stopTimer();workout=null});window.addEventListener('hashchange',()=>{stopTimer();workout=null;if($('#dlg').open)$('#dlg').close()});
function reportView(){const u=me(),t=todayISO(),start=addDays(t,-6),plans=DB.plans.filter(p=>p.userId===u.id),items=plans.flatMap(p=>p.items).filter(i=>i.done&&i.completedOn>=start&&i.completedOn<=t),logs=myLogs(u.id).filter(l=>l.date>=start&&l.date<=t),minutes=items.reduce((n,i)=>n+(i.actual?.duration||0),0);return shell('user','/tai-khoan/bao-cao','Bảy ngày của bạn',`<p class="muted">${vd(start)} – ${vd(t)} · Dựa trên dữ liệu đã ghi</p><div class="stats"><div class="stat"><b>${items.length}</b><span>Bài tập hoàn thành</span></div><div class="stat"><b>${num(minutes)}</b><span>Phút tập thực tế đã ghi</span></div><div class="stat"><b>${logs.length}/7</b><span>Ngày có nhật ký sức khỏe</span></div></div><div class="pn"><h2>Hoạt động trong tuần</h2>${barChart(Array.from({length:7},(_,k)=>{const d=addDays(start,k);return{l:vd(d).slice(0,5),v:items.filter(i=>i.completedOn===d).length}}),'Số bài tập hoàn thành theo ngày')}</div><div class="pn"><h2>Cân nặng đã ghi</h2>${lineChart(logs.filter(l=>l.weight>0).map(l=>({x:vd(l.date),y:l.weight})),{unit:'kg'})}</div><p class="fine">Ngày thiếu dữ liệu không có nghĩa là bạn không vận động. Báo cáo không đánh giá tình trạng sức khỏe.</p><button class="btn" onclick="App.exportReport()">Tải nhật ký tuần (CSV)</button>`)}
R[0][1]=viewHome;
R.push(['/tai-khoan/bao-cao',reportView,'user']);
App.exportReport=()=>{const t=todayISO(),start=addDays(t,-6),logs=myLogs(me().id).filter(l=>l.date>=start&&l.date<=t);const lines=['Ngay,Can_nang_kg,Nuoc_ml,Giac_ngu_gio',...logs.map(l=>[l.date,l.weight||'',l.water||0,l.sleep||0].join(','))];const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='fithealth-nhat-ky-tuan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

window.App=App;

(async function init(){
  try{const s=lsGet(KEY);if(s)DB=JSON.parse(s)}catch(e){DB=null}
  if(!DB||!DB.users){DB=await seed();save()}
  sessionId=lsGet(SKEY);
  if(!me())sessionId=null;
  route();
})();
})();
</script>
